[versions]
# The compiler. Everything that has to agree with it (coroutines, serialization) comes from the
# shared `wip` catalog that `io.github.youndie.sborka.settings` puts beside this one.
# The shared build conventions. One number: every sborka plugin below takes its version from here,
# and settings.gradle.kts repeats it by hand because a settings plugin cannot read a catalog.
sborka = "0.4.0.111"
# The compiler comes with them. `wip`, the catalog a sborka release publishes, carries `kotlin`,
# `ksp` and `composeMultiplatform` — three versions that are one decision: KSP is built against a
# compiler, the Compose plugin is versioned by it, and a Compose Multiplatform release is built
# against a plugin range.
# Phase 2. Pinned here rather than taken from the shared `wip` catalog, which carries none of these.
# KSP is versioned independently of the Kotlin compiler since KSP2; viddik's processor runs on it.
# viddik ships the plugin, the annotations and the capture engine under one version, which is what
# keeps the processor and the renderer in step. 0.4.0 is on Maven Central under
# `io.github.youndie.viddik`; everything up to 0.3.3 is on reposilite under `ru.workinprogress` and
# needs a repository this project does not have.
viddik = "0.4.0"
# The window frame: a Compose-drawn title bar with the host's own window controls. The design draws
# one in its own colours, which is a custom frame whether or not it says so.
appframe = "0.2.1.35"
# The second kit's library (B-160): the portfolio's mid-2000s design system. Published to
# reposilite's snapshots only, as `<version>.<run>` from every push to its main; pinned to one run,
# because a snapshot line that moved under a golden is a golden that fails for no change here.
oldge = "0.1.1.37"
# The Material kit's scheme from a seed (B-161): Google's material-color-utilities ported to Compose.
# Upstream, from Maven Central — not the portfolio's `io.github.youndie.materialkolor` fork, which
# exists for a `linuxX64` target and carries only the utilities. 5.0.1 because its JVM module was
# built against what this build resolves: Compose 1.12.0 and material3 1.12.0-alpha03 (Compose
# Multiplatform 1.12.1 here) on Kotlin 2.4.10, read off `material-kolor-jvm-5.0.1.module`; 5.0.0
# was built against Compose 1.11.1 and 4.x against Kotlin 2.3.
materialkolor = "5.0.1"

[libraries]
appframe = { module = "io.github.youndie:appframe-desktop", version.ref = "appframe" }
oldge-core = { module = "io.github.youndie:oldge-core", version.ref = "oldge" }
materialkolor = { module = "com.materialkolor:material-kolor", version.ref = "materialkolor" }

[plugins]
sborkaBase = { id = "io.github.youndie.sborka.base", version.ref = "sborka" }
sborkaTest = { id = "io.github.youndie.sborka.test", version.ref = "sborka" }
sborkaKmp = { id = "io.github.youndie.sborka.kmp", version.ref = "sborka" }
sborkaLint = { id = "io.github.youndie.sborka.lint", version.ref = "sborka" }
viddik = { id = "io.github.youndie.viddik", version.ref = "viddik" }
