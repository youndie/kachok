#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3G
#Gradle
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# A default that is a snapshot on purpose: a build with no -PVERSION must not be able to produce
# something that looks like a release.
version=0.1.0-SNAPSHOT

# WHAT THIS REPOSITORY TELLS THE SHARED CONVENTIONS (io.github.youndie.sborka).
sborka.group=ru.workinprogress.kachok
sborka.repository=youndie/kachok
sborka.description=A BitTorrent client in Kotlin: multiplatform engine, JDK 25 on the desktop.
sborka.inceptionYear=2026

# 25 for both. The engine's JVM implementation is written against JDK 25 APIs (ScopedValue, the
# AOT cache, compact object headers, FileChannel.map with an Arena) and nothing older consumes it.
sborka.jvmToolchain=25
sborka.jvmFloor=25
