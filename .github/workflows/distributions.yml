name: distributions

# **`workflow_dispatch` and nothing else.** A run produces about 200 MB of installers on three
# runners; a build on every push would be storage and minutes spent on artifacts nobody downloads.
# The gate that must run on every push is in `ci.yml`, and it is a different question.
on:
  # A tag `v0.1.<n>` is a release: the same jobs build and check the three installers, and
  # `release` below publishes them (B-187). Tags are pushed by the owner and by nobody else.
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      retention-days:
        description: "How long to keep the artifacts (days, 1-30)"
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  # **`jpackage` cannot cross-compile**, which is why this is a matrix and not a loop: a macOS
  # bundle is built on macOS, an `.msi` on Windows, a `.deb` on Linux, and there is no host that
  # can produce another host's installer.
  desktop:
    strategy:
      # One platform failing must not cancel the other two: a run that produced two of three
      # installers is worth having, and which one broke is the thing to find out.
      fail-fast: false
      matrix:
        include:
          # `macos-latest` is arm64. An Intel `.dmg` is `macos-13` and one more matrix entry, added
          # when somebody has an Intel Mac to give it to — the artifact's name says which it is.
          - os: macos-latest
            format: dmg
          - os: windows-latest
            format: msi
          - os: ubuntu-latest
            format: deb
    runs-on: ${{ matrix.os }}
    steps:
      # **The whole history**, because the package version's third component is the commit count
      # and `actions/checkout` fetches one commit by default — which would make every build on
      # every branch version `…1`, and an `.msi` that cannot be installed over the last one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: youndie/sborka/.github/actions/setup-kotlin@v0.5.0.135

      # `jpackage` skips the DEB bundler without `fakeroot` — with a message that names it, which is
      # the good kind of failure — and `:ui:patchDesktopEntry` repacks the package with it. `xvfb`
      # is the display `:ui:checkDownload` opens its window on.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot xvfb

      # **Before the packaging, on the platform that will ship it.** The trimmed `jlink` runtime is
      # the only place a missing module can exist, and it shipped once without `java.net.http`
      # (B-78). This runs the packaged launcher's own preflight, so a broken image fails the job
      # instead of reaching whoever downloads the artifact.
      - run: ./gradlew :ui:checkDistributable --stacktrace

      # **And the window that ships, downloading.** The preflight exits before a window exists, so
      # what packaging breaks in one — a composable, the MCP server's serialisation — only shows when
      # the packaged launcher opens it and is made to fetch a torrent (B-155).
      - if: runner.os != 'Linux'
        run: ./gradlew :ui:checkDownload --stacktrace
      - if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew :ui:checkDownload --stacktrace

      # **The release variant**, the one `checkDistributable` above just ran.
      - run: ./gradlew :ui:packageReleaseDistributionForCurrentOS --stacktrace

      # So the log says what was built rather than only that something was.
      # The .msi is a database, and its Shortcut table says what an install would put on the desktop
      # and in the Start menu - read here with nothing installed, because no runner has a desktop
      # anybody looks at (B-186; #27 was a package that made neither).
      - if: runner.os == 'Windows'
        name: The .msi makes a desktop shortcut and a Start menu entry
        shell: pwsh
        run: |
          $msi = Get-ChildItem ui/build/compose/binaries/main-release/msi/*.msi | Select-Object -First 1
          ./scripts/check_msi_shortcuts.ps1 $msi.FullName

      - name: What came out
        shell: bash
        run: |
          ls -lh ui/build/compose/binaries/main-release/${{ matrix.format }}/
          # And what it installs to.
          du -sh ui/build/compose/binaries/main-release/app/*

      - uses: actions/upload-artifact@v7
        with:
          # The commit is in the name because two artifacts from two commits are otherwise told
          # apart only by the run they came from, and a downloaded file keeps none of that.
          name: kachok-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: ui/build/compose/binaries/main-release/${{ matrix.format }}/*.${{ matrix.format }}
          # **The guard.** `packageDistributionForCurrentOS` with no format configured succeeded in
          # under a second and wrote nothing, which is how B-82 was filed; without this a run that
          # produces no installer is a green run.
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days || '30' }}

  # The headless client, which is a different artifact for a different machine: no window, no
  # installer, a `jlink` image with a launcher that fixes the JVM flags. It is what the always-on
  # box in [B-87](../../docs/backlog/B-87-a-server-with-a-web-face.md) would run.
  headless:
    # Linux only, and that is a fact rather than a choice: the generated launcher is `#!/bin/sh`
    # with a colon-separated class path, so it does not run on Windows at all.
    runs-on: ubuntu-latest
    steps:
      # **The whole history**, because the package version's third component is the commit count
      # and `actions/checkout` fetches one commit by default — which would make every build on
      # every branch version `…1`, and an `.msi` that cannot be installed over the last one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: youndie/sborka/.github/actions/setup-kotlin@v0.5.0.135

      - run: ./gradlew :cli:runtimeImage --stacktrace

      # **A tarball, and not the directory.** `upload-artifact` zips what it is given and a zip
      # keeps no executable bit, so an uploaded `bin/kachok` arrives unrunnable — a distribution
      # that looks complete and is not.
      - name: Tar it, so the launcher stays executable
        run: tar -czf kachok-headless-linux-x64.tar.gz -C cli/build kachok

      - uses: actions/upload-artifact@v7
        with:
          name: kachok-headless-Linux-X64-${{ github.sha }}
          path: kachok-headless-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days || '30' }}

  # B-187: a tag publishes the three installers as a GitHub Release. Only after every `desktop`
  # entry is green, so a release never has two files of three; from the artifacts this run built,
  # so they are the tagged commit's; and only once `release_assets.sh` agrees that the tag names
  # the packages' version - a tag on the wrong commit fails here and publishes nothing. The `.dmg`
  # says `1.0.<n>` because Apple refuses a leading zero (B-82), and the notes say so.
  release:
    if: github.ref_type == 'tag'
    needs: [desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: kachok-*-${{ github.sha }}
          path: installers

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Into a file and not through `< <(…)`: a process substitution's exit status is lost, and
          # a refused tag would have gone on to publish a release with no files at all.
          scripts/release_assets.sh "$GITHUB_REF_NAME" installers > assets.txt
          mapfile -t files < assets.txt
          n="${GITHUB_REF_NAME#v0.1.}"
          printf '%s\n' \
            "Installers built from ${GITHUB_SHA::7}: \`.msi\` for Windows, \`.dmg\` for macOS on Apple silicon, \`.deb\` for Debian and Ubuntu." \
            "" \
            "The macOS package says 1.0.$n where the others say 0.1.$n: Apple refuses a version whose first number is zero. They are the same build." \
            > notes.md
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "kachok $GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes
